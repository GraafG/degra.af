name: Deploy static site to DirectAdmin via rsync

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Fail closed before doing any other work: no pinned host key, no deploy.
      # Independent of the equivalent assertion in "Prepare SSH key" by design --
      # neither check may rely on the other's continued existence.
      - name: Preflight - require pinned host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "$(printf '%s' "${SSH_KNOWN_HOSTS:-}" | tr -d '[:space:]')" ]; then
            echo "::error::SSH_KNOWN_HOSTS is unset, empty, or whitespace-only. Refusing to deploy: the server's identity cannot be verified without a pinned host key."
            echo "To (re)generate it, run the following against the deploy host and paste the ENTIRE output verbatim:"
            echo "    ssh-keyscan -p <SSH_PORT> <SSH_HOST>"
            echo "  - use the values held in this repository's SSH_PORT and SSH_HOST secrets"
            echo "  - keep every output line; there is one per host key type and dropping the negotiated one causes a mismatch"
            echo "  - keep the [host]:port bracket form that ssh-keyscan emits for non-default ports; do not hand-edit it"
            echo "Then store it, e.g.: gh secret set SSH_KNOWN_HOSTS -R <owner>/<repo> < scanned-keys.txt"
            exit 1
          fi

          echo "Preflight OK: SSH_KNOWN_HOSTS is present."

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Nothing after this step needs git authentication. Left at the
          # default (true), actions/checkout writes an
          # `AUTHORIZATION: basic <base64>` extraheader into .git/config, and
          # the rsync below copies the checkout to a public web root. This is
          # the layer that stops the credential existing at all; the excludes
          # are the layer that stops it being copied. Both, because either
          # alone is one edit from regression and they fail independently.
          persist-credentials: false

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Second, independent assertion. Must precede any write to known_hosts
          # so that a failure here can never leave a partial file behind for a
          # later step to connect against.
          if [ -z "$(printf '%s' "${SSH_KNOWN_HOSTS:-}" | tr -d '[:space:]')" ]; then
            echo "::error::SSH_KNOWN_HOSTS is unset, empty, or whitespace-only. Refusing to write known_hosts or deploy."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::known_hosts is empty after writing SSH_KNOWN_HOSTS; refusing to deploy."
            rm -f ~/.ssh/known_hosts
            exit 1
          fi

          echo "Using pinned host key from SSH_KNOWN_HOSTS ($(wc -l < ~/.ssh/known_hosts | tr -d ' ') line(s))."

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_PATH: ${{ secrets.SSH_TARGET_PATH }}
        run: |
          set -euo pipefail

          # The rsync source is site/, and that is the control: the deploy is an
          # ALLOWLIST. Only what is inside site/ can ever reach the web root, so
          # a file added to the repository root is not published by default. It
          # used to be ./, which made the deploy a denylist -- everything shipped
          # unless someone remembered an --exclude -- and that is the shape that
          # published .git/config, not the absence of any particular exclusion.
          # Adding more --exclude lines would have fixed the instance and kept
          # the shape.
          #
          # The two exclusions below are now belt-and-braces rather than
          # load-bearing: neither .git nor .github exists inside site/. They are
          # kept because --delete-excluded is what removes an ALREADY-PUBLISHED
          # copy from the server, and dropping them would silently retire that.
          # Measured:
          #
          #   --delete --exclude=.git                     dst/.git/config PRESENT
          #   --delete --delete-excluded --exclude=.git   dst/.git/config gone
          #
          # rsync protects excluded paths on the receiving side from --delete,
          # so excluding is not removing.
          #
          # Note the site's own 404 rule in .htaccess cannot confirm any of this:
          # it masks .git with a 404 whether the directory is present or absent.
          # The evidence is this step's own log -- look for "deleting ".
          # This deploy additionally prunes README.md, LICENSE and SECURITY.md,
          # which are currently published and are not site content.
          rsync -avz --delete --delete-excluded \
            --exclude='.git' \
            --exclude='.github' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            site/ \
            "$SSH_USER@$SSH_HOST:$SSH_TARGET_PATH"