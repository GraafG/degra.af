name: Deploy static site to DirectAdmin via rsync

on:
  push:
    branches:
      - main
    # An ALLOWLIST, deliberately not paths-ignore. The set of paths that do not
    # affect the deploy is unbounded and grows every time anyone adds a file; the
    # set that does affect it is exactly the rsync source plus this file. That is
    # the same argument that moved the rsync source from ./ to site/ -- a denylist
    # is correct only until the next thing is added to it, and nothing tells you
    # when that moment arrives. Spelling the trigger as paths-ignore would
    # reintroduce in the TRIGGER the shape that was just removed from the RSYNC.
    #
    # Measured, not assumed: site/ is full of hidden paths -- site/.htaccess and
    # site/.well-known/security.txt are the two most deploy-critical files in the
    # repository -- and a matcher that skipped dotfiles would silently stop
    # deploying .htaccess changes while looking correct. GitHub's matcher was
    # probed directly on a branch, one commit per row so the filter was evaluated
    # per push rather than over a batch:
    #
    #   probe/visible.txt          GREEN CONTROL   FIRED
    #   probe/.dotfile                             FIRED    <- dotfile matches
    #   probe/.hiddendir/inner.txt                 FIRED    <- under hidden dir
    #   OUTSIDE.txt                RED CONTROL     did not fire
    #
    # The red control is what makes the three greens mean anything: a filter that
    # fired on everything would have produced the same three greens.
    #
    # This file is listed because a change to the rsync flags that never runs is
    # a change that was never exercised. Property 5 in pr-open.yml asserts that
    # this list still covers the rsync source, because the dangerous regression
    # is not deleting the filter -- it is moving the source and leaving the filter
    # behind, after which content changes silently stop deploying.
    #
    # Known cost, stated rather than hidden: until now every merge redeployed, so
    # the deploy was incidentally the only thing reconciling server-side drift
    # (a hand edit through the DirectAdmin file manager, a half-finished earlier
    # deploy). Filtering removes that incidental repair on CI-only merges. It was
    # never a designed control and nothing depends on it, but it was real, and
    # the honest replacement is a scheduled read-only drift check comparing live
    # bytes to the git blob -- not a scheduled rsync, which would be an
    # unattended write to production that nobody asked for.
    paths:
      - 'site/**'
      - '.github/workflows/deploy-directadmin.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Fail closed before doing any other work: no pinned host key, no deploy.
      # Independent of the equivalent assertion in "Prepare SSH key" by design --
      # neither check may rely on the other's continued existence.
      - name: Preflight - require pinned host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "$(printf '%s' "${SSH_KNOWN_HOSTS:-}" | tr -d '[:space:]')" ]; then
            echo "::error::SSH_KNOWN_HOSTS is unset, empty, or whitespace-only. Refusing to deploy: the server's identity cannot be verified without a pinned host key."
            echo "To (re)generate it, run the following against the deploy host and paste the ENTIRE output verbatim:"
            echo "    ssh-keyscan -p <SSH_PORT> <SSH_HOST>"
            echo "  - use the values held in this repository's SSH_PORT and SSH_HOST secrets"
            echo "  - keep every output line; there is one per host key type and dropping the negotiated one causes a mismatch"
            echo "  - keep the [host]:port bracket form that ssh-keyscan emits for non-default ports; do not hand-edit it"
            echo "Then store it, e.g.: gh secret set SSH_KNOWN_HOSTS -R <owner>/<repo> < scanned-keys.txt"
            exit 1
          fi

          echo "Preflight OK: SSH_KNOWN_HOSTS is present."

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Nothing after this step needs git authentication. Left at the
          # default (true), actions/checkout writes an
          # `AUTHORIZATION: basic <base64>` extraheader into .git/config, and
          # the rsync below copies the checkout to a public web root. This is
          # the layer that stops the credential existing at all; the excludes
          # are the layer that stops it being copied. Both, because either
          # alone is one edit from regression and they fail independently.
          persist-credentials: false

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Second, independent assertion. Must precede any write to known_hosts
          # so that a failure here can never leave a partial file behind for a
          # later step to connect against.
          if [ -z "$(printf '%s' "${SSH_KNOWN_HOSTS:-}" | tr -d '[:space:]')" ]; then
            echo "::error::SSH_KNOWN_HOSTS is unset, empty, or whitespace-only. Refusing to write known_hosts or deploy."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::known_hosts is empty after writing SSH_KNOWN_HOSTS; refusing to deploy."
            rm -f ~/.ssh/known_hosts
            exit 1
          fi

          echo "Using pinned host key from SSH_KNOWN_HOSTS ($(wc -l < ~/.ssh/known_hosts | tr -d ' ') line(s))."

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_PATH: ${{ secrets.SSH_TARGET_PATH }}
        run: |
          set -euo pipefail

          # The rsync source is site/, and that is the control: the deploy is an
          # ALLOWLIST. Only what is inside site/ can ever reach the web root, so
          # a file added to the repository root is not published by default. It
          # used to be ./, which made the deploy a denylist -- everything shipped
          # unless someone remembered an --exclude -- and that is the shape that
          # published .git/config, not the absence of any particular exclusion.
          # Adding more --exclude lines would have fixed the instance and kept
          # the shape.
          #
          # The two exclusions below are belt-and-braces rather than load-bearing:
          # nothing named .git or .github exists inside site/, so --delete alone
          # would already prune them. They are kept for a property rather than an
          # inventory -- if the source ever regresses to ./ in the same edit that
          # removes the source gate, they are what stands between .git/config and
          # the public web root. That is the exact failure this deploy has already
          # had once, so the redundancy is deliberate.
          #
          # Measured in alpine:3 (rsync 3.4.3), source = site/, destination
          # pre-seeded with .git/config, .github/, uploads/photo.jpg, OLDFILE.md:
          #
          #   CONTROL: no rsync run at all      .git PRESENT  uploads PRESENT  OLDFILE PRESENT
          #   no --delete                       .git PRESENT  uploads PRESENT  OLDFILE PRESENT
          #   --delete alone                    .git gone     uploads gone     OLDFILE gone
          #   --delete + excludes               .git PRESENT  uploads gone     OLDFILE gone
          #   + --delete-excluded  [shipped]    .git gone     uploads gone     OLDFILE gone
          #
          # The control row is why the others can be read: it distinguishes "the
          # rsync pruned nothing" from "the rsync did not run", which otherwise
          # print identically.
          #
          # Row 4 is the reason --delete-excluded is here. rsync PROTECTS excluded
          # paths on the receiving side from --delete, so excluding is not removing
          # and an already-published copy would survive indefinitely.
          #
          # HAZARD, and it is the inverse of what --exclude reads like. On THIS
          # invocation --exclude does not protect anything on the server; combined
          # with --delete-excluded it is an instruction to delete it:
          #
          #   --exclude=uploads, shipped invocation      uploads gone     <- intent inverted
          #   --exclude=uploads, no --delete-excluded    uploads PRESENT  <- intent honoured
          #
          # So an --exclude added here to preserve server-side state does the
          # opposite of what it looks like. Anything that must persist on the
          # server and is not in site/ cannot be protected by an --exclude on this
          # command at all. This is a property of the flag pair, not a list of
          # files, and it is stated that way on purpose: an inventory of what is
          # currently published goes stale the moment a deploy runs, and a comment
          # that was true when written is worse than no comment once it inverts.
          #
          # Note the site's own 404 rule in .htaccess cannot confirm any of this:
          # it masks dotfiles with a 404 whether they are present or absent. The
          # evidence is this step's own log -- look for "deleting ".
          rsync -avz --delete --delete-excluded \
            --exclude='.git' \
            --exclude='.github' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            site/ \
            "$SSH_USER@$SSH_HOST:$SSH_TARGET_PATH"