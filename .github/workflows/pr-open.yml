name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: HSTS header must not advertise preload consent
        run: |
          set -euo pipefail

          # Inspect only the live directive, never the surrounding comments
          # (which mention `preload` by name while explaining its absence).
          line="$(grep -E '^[[:space:]]*Header[[:space:]]+always[[:space:]]+set[[:space:]]+Strict-Transport-Security' site/.htaccess || true)"

          if [ -z "$line" ]; then
            echo "FAIL: no 'Header always set Strict-Transport-Security' directive in .htaccess"
            exit 1
          fi

          count="$(printf '%s\n' "$line" | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "FAIL: expected exactly 1 Strict-Transport-Security directive, found $count"
            printf '%s\n' "$line"
            exit 1
          fi

          echo "directive: $line"
          rc=0

          case "$line" in
            *max-age=31536000*) echo "ok: max-age=31536000 present" ;;
            *) echo "FAIL: max-age=31536000 missing or changed"; rc=1 ;;
          esac

          case "$line" in
            *includeSubDomains*) echo "ok: includeSubDomains present" ;;
            *) echo "FAIL: includeSubDomains missing"; rc=1 ;;
          esac

          case "$line" in
            *preload*)
              echo "FAIL: 'preload' directive present in the HSTS header."
              echo "      This is a consent flag: anyone may submit an eligible domain"
              echo "      advertising it to the Chrome HSTS preload list, and removal is"
              echo "      slow. Sibling domain geertdegraaf.nl is already status=removed."
              echo "      Dropping it is not a downgrade - max-age and includeSubDomains"
              echo "      still enforce HTTPS. See the comment block in .htaccess."
              rc=1
              ;;
            *) echo "ok: 'preload' absent" ;;
          esac

          exit "$rc"

      - name: mod_rewrite must be enabled in the top-level context
        run: |
          set -euo pipefail

          # Guards against a silent failure mode: without `RewriteEngine On`,
          # mod_rewrite ignores every Rewrite* line in this file. There is no
          # error, no log entry and no 5xx -- the rules stay textually perfect
          # and become permanently inert, so the www -> apex redirect simply
          # stops working while the config still reviews as correct.
          #
          # This is a realised copy-propagation risk, not a hypothetical: the
          # redirect from this file was circulated to sibling repos with the
          # directive stripped, and was caught by hand once. The next copy is
          # the one nobody catches.
          #
          # Deliberately NOT asserted:
          #
          #   Ordering. It is tempting to require `RewriteEngine On` before the
          #   first Rewrite* line, because that is how the file reads. But the
          #   directive is a per-context configuration flag settled when httpd
          #   merges the config, not a sequential switch -- within one context
          #   the last value wins regardless of where the rules sit relative to
          #   it. An ordering arm would be stricter than the server and would
          #   one day go red on a file that works.
          #
          #   Count. This file legitimately sets the directive twice: once at
          #   the top level and once inside <IfModule mod_rewrite.c>. An
          #   "exactly one" arm would go red on the current, deployed, working
          #   configuration -- a gate whose first firing is guaranteed wrong.
          #
          # Red on a working file is the expensive failure: it teaches people to
          # edit the gate, so it gets deleted rather than debugged, costing the
          # coverage it was added to provide.
          #
          # Why this is modelled as STATE and not as a line being present:
          # a presence check reads `RewriteEngine On` followed later by
          # `RewriteEngine Off` as fine. Tracking the value through the parse
          # makes catching that automatic rather than a second clause somebody
          # has to remember to implement -- and it is the clause most likely to
          # be dropped, because the first half is the one that reads like the
          # requirement.
          #
          # Why the state model tracks <IfModule> scope rather than being flat:
          # a flat last-value-wins model is NOT a safe simplification for this
          # file. .htaccess sets the directive twice, and the second one lives
          # inside <IfModule mod_rewrite.c>. Delete the top-level directive --
          # exactly the copy-propagation mutation this gate exists to catch --
          # and a flat model still reports effective=on from the nested one and
          # passes, while the www -> apex rule at the top level is inert.
          # Verified against this file: the flat model returns PASS on that
          # mutation, the scoped model below returns FAIL.

          # Resolve the effective TOP-LEVEL setting the way httpd does: track
          # container nesting, ignore anything inside a <Section>, and let the
          # last value in the top-level context win.
          scan="$(awk '
            { line = $0 }

            # Strip whole-line comments. A commented-out directive must not
            # satisfy the gate, and a comment mentioning <IfModule> must not
            # shift the nesting depth. Apache treats a trailing # as literal,
            # so only leading-# lines are comments.
            { sub(/^[ \t]*#.*$/, "", line) }

            line ~ /^[ \t]*<\/[A-Za-z]/ { depth--; next }
            line ~ /^[ \t]*<[A-Za-z]/   { depth++; next }

            {
              l = tolower(line)
              if (depth == 0) {
                if (l ~ /^[ \t]*rewriteengine[ \t]+on[ \t]*$/)       { seen_on = 1; last = "on" }
                else if (l ~ /^[ \t]*rewriteengine[ \t]+off[ \t]*$/) { last = "off" }
              }
            }

            END { printf "%s %s\n", (seen_on ? "yes" : "no"), (last == "" ? "unset" : last) }
          ' site/.htaccess)"

          seen_on="${scan%% *}"
          effective="${scan##* }"

          echo "top-level RewriteEngine: present=$seen_on effective=$effective"

          # Report every arm before exiting: a checker that stops at the first
          # failure hides the state of the arms after it.
          rc=0

          if [ "$seen_on" = "yes" ]; then
            echo "ok: 'RewriteEngine On' present in the top-level context"
          else
            echo "FAIL: no 'RewriteEngine On' in the top-level context of .htaccess."
            echo "      mod_rewrite will ignore every Rewrite* line in this file."
            echo "      The www -> apex redirect becomes inert with no error and"
            echo "      no log entry. A nested directive inside <IfModule> does"
            echo "      not enable the rules that live at the top level."
            rc=1
          fi

          if [ "$effective" = "off" ]; then
            echo "FAIL: the top-level RewriteEngine is effectively Off."
            echo "      A later 'RewriteEngine Off' in the same context wins over"
            echo "      an earlier On, disabling the rules regardless of position."
            rc=1
          else
            echo "ok: top-level RewriteEngine is not switched Off"
          fi

          exit "$rc"

      - name: security.txt must be served as text/plain with charset=utf-8
        run: |
          set -euo pipefail

          # RFC 9116 section 3 requires "text/plain; charset=utf-8". Apache's
          # mime.types gives .txt a bare text/plain, so this has to be set.
          #
          # The value is asserted, not merely the directive's existence. A bare
          # ForceType "text/plain" is textually present and behaviourally
          # identical to the bug, so a "a ForceType exists" arm would pass in
          # the exact state being fixed -- the same shape as an "an HSTS header
          # exists" arm passing while it still advertises preload.

          scan="$(awk '
            { line = $0; sub(/^[ \t]*#.*$/, "", line); l = tolower(line) }

            l ~ /^[ \t]*<files[ \t]+"?security\.txt"?[ \t]*>/ { inblock = 1; next }
            l ~ /^[ \t]*<\/files[ \t]*>/                      { inblock = 0; next }

            inblock && l ~ /^[ \t]*forcetype[ \t]/ {
              arg = line
              sub(/^[ \t]*[^ \t]+[ \t]+/, "", arg)   # drop the directive name
              sub(/[ \t]+$/, "", arg)
              found = 1
            }

            END { printf "%s|%s\n", (found ? "yes" : "no"), arg }
          ' site/.htaccess)"

          found="${scan%%|*}"
          arg="${scan#*|}"
          lower_arg="$(printf '%s' "$arg" | tr '[:upper:]' '[:lower:]')"

          echo "ForceType in <Files \"security.txt\">: found=$found value=$arg"

          rc=0

          if [ "$found" = "yes" ]; then
            echo "ok: ForceType present for security.txt"
          else
            echo "FAIL: no ForceType for security.txt in .htaccess."
            echo "      Apache serves .txt as a bare text/plain, which does not"
            echo "      satisfy RFC 9116 section 3."
            rc=1
          fi

          case "$lower_arg" in
            *text/plain*) echo "ok: media type is text/plain" ;;
            *) echo "FAIL: media type is not text/plain (got: $arg)"; rc=1 ;;
          esac

          case "$lower_arg" in
            *charset=utf-8*)
              echo "ok: charset=utf-8 present"
              ;;
            *)
              echo "FAIL: the ForceType value does not carry charset=utf-8."
              echo "      A bare text/plain is textually present and behaviourally"
              echo "      identical to having no ForceType at all. RFC 9116"
              echo "      section 3 requires the charset."
              rc=1
              ;;
          esac

          # Deliberately NOT asserted: quote style. The file uses double quotes
          # for consistency with every other quoted argument, but a single-quoted
          # argument was measured against Apache 2.4.68 and works -- correct
          # Content-Type, site root still 200, nothing in the error log. Gating
          # style would put the gate red on a working configuration, which is the
          # failure that teaches people to edit gates rather than debug them.

          exit "$rc"

      - name: robots.txt must not be retyped by any content-type directive
        # Blast radius. The intuitive way to satisfy RFC 9116 is
        #
        #   AddType "text/plain; charset=utf-8" .txt
        #
        # which is shorter and reads better than a <Files> container -- and
        # measured against Apache 2.4 it also retypes robots.txt. Every other
        # arm in this job stays green in that state, because security.txt does
        # get the right header. The change is correct about its target and
        # wrong about its scope.
        #
        # This arm asks the question the experiment was actually run to answer:
        # does any content-type or charset directive REACH robots.txt. The file
        # is parsed into container scopes the way httpd merges them and the
        # basename is tested against the enclosing <Files>/<FilesMatch>
        # patterns, rather than matching directive spellings.
        #
        # It replaced an earlier arm that asked instead "is any content-type
        # directive outside <Files \"security.txt\">". That is a proxy for this
        # question, and the two come apart in both directions -- measured on
        # httpd:2.4, negative control (AllowOverride None) first so the
        # instrument was shown able to report "unchanged":
        #
        #   retypes robots.txt, proxy stayed green:
        #     AddCharset utf-8 .txt              robots.txt -> charset=utf-8
        #     AddDefaultCharset utf-8            robots.txt -> charset=utf-8
        #   does not touch robots.txt, proxy went red:
        #     AddType text/markdown .md          robots.txt -> bare text/plain
        #     <FilesMatch "^security\.txt$">     robots.txt -> bare text/plain
        #
        # Both directions are pinned as cases in the gate-selftest job, which is
        # what stops this arm drifting into either a gate that misses the defect
        # or a gate that is red on a working file. A suite of only red cases
        # cannot detect over-strictness, so the green cases are not decoration.
        run: bash .github/checks/htaccess-content-type-scope.sh site/.htaccess robots.txt

      - name: deploy must publish site/ only, never the repository root
        run: |
          set -euo pipefail

          # The deploy rsyncs to a public web root. It used to send ./, which
          # made it a DENYLIST: everything shipped unless someone remembered an
          # --exclude. That shape published .git/config, which carries an
          # `AUTHORIZATION: basic <base64>` extraheader when persist-credentials
          # is left at its default of true.
          #
          # Confirmed by probing production rather than reading the YAML: files
          # that are repository content and not site content were live --
          # /README.md 200, /LICENSE 200, /SECURITY.md 200 -- so the root really
          # is mirrored. /.git/config returned 404, but a 404 is evidence that
          # something answered, not that the file is absent: .htaccess has a
          # single RewriteRule masking dotfiles. That rule stays as the second
          # layer. It is not sufficient as the first, because it asserts a repo
          # file while the property depends on mod_rewrite being loaded and
          # AllowOverride still being granted on the host -- both of which can
          # change with this gate staying green.
          #
          # The source is now site/, which makes the deploy an ALLOWLIST: a file
          # added to the repository root cannot be published. Property 4 asserts
          # that, because otherwise it is merely true rather than enforced, and
          # reverting one word restores the shape that leaked the credential.
          #
          # Four properties, asserted separately because they fail independently
          # and each is one edit from regression.

          wf=".github/workflows/deploy-directadmin.yml"
          rc=0

          # Read only the directives, never the prose. The comment block in
          # the deploy workflow explains these flags and necessarily names
          # them, so a file-wide grep could be satisfied by the very text
          # arguing for them -- a gate defeated by its own documentation.
          # Strip whole-line comments first and assert against what is left.
          # Verified with a fixture that comments the directives out.
          live="$(sed 's/^[[:space:]]*#.*$//' "$wf")"

          # 1. The credential must not be written into the checkout at all.
          if printf '%s' "$live" | grep -qE '^[[:space:]]*persist-credentials:[[:space:]]*false[[:space:]]*$'; then
            echo "ok: deploy checkout sets persist-credentials: false"
          else
            echo "FAIL: the deploy checkout does not set persist-credentials: false."
            echo "      actions/checkout defaults it to true and writes an"
            echo "      AUTHORIZATION extraheader into .git/config, which the"
            echo "      rsync below copies to a public web root."
            rc=1
          fi

          # 2. It must not be copied even if it is written.
          missing=""
          for pat in "--exclude='.git'" "--exclude='.github'"; do
            printf '%s' "$live" | grep -qF -- "$pat" || missing="$missing $pat"
          done
          if [ -z "$missing" ]; then
            echo "ok: rsync excludes .git and .github"
          else
            echo "FAIL: the deploy rsync is missing exclusions:$missing"
            echo "      The repository root is rsynced to a public web root, so"
            echo "      anything not excluded is published."
            rc=1
          fi

          # 3. Excluding is not removing. Measured with rsync:
          #      --delete --exclude=.git                  dst/.git/config PRESENT
          #      --delete --delete-excluded --exclude=.git dst/.git/config gone
          #    Without --delete-excluded a .git already on the server is
          #    protected from --delete and survives every future deploy.
          if printf '%s' "$live" | grep -qF -- "--delete-excluded"; then
            echo "ok: rsync uses --delete-excluded, so an already-published .git is removed"
          else
            echo "FAIL: the deploy rsync excludes .git but does not use --delete-excluded."
            echo "      rsync protects excluded paths on the receiving side from"
            echo "      --delete, so a .git directory already on the server would"
            echo "      survive indefinitely. Excluding is not removing."
            rc=1
          fi

          # 4. The source path is the allowlist. Asserted positively -- "the source
          #    is site/" -- rather than as "the source is not ./", because the set
          #    of wrong sources is unbounded and an arm enumerating them would
          #    silently miss the next one.
          #
          #    The previous version of this arm said exactly that in prose and then
          #    did the opposite: it matched the source against the fixed alternation
          #    (site/|./|.|../), so anything outside that list extracted as empty and
          #    reported "not found". Measured in alpine:3 with rsync, against a
          #    fixture tree, four spellings produce a destination tree IDENTICAL to
          #    site/ -- and all four were red:
          #
          #      ./site/                    ./img/a.jpg ./index.html   was RED
          #      "site/"                    ./img/a.jpg ./index.html   was RED
          #      $GITHUB_WORKSPACE/site/    ./img/a.jpg ./index.html   was RED
          #      site/./                    ./img/a.jpg ./index.html   was RED
          #      site/        (shipped)     ./img/a.jpg ./index.html      GREEN
          #      site         (no slash)    ./site/img/a.jpg ...       correctly RED
          #      ./           (denylist)    ./site/img/a.jpg ...       correctly RED
          #
          #    A gate that is red on a working config gets edited by whoever hits it,
          #    and the edit that makes it green is rarely the careful one.
          #
          #    So: locate the source STRUCTURALLY -- it is the continuation line
          #    immediately above the destination argument, which is what makes it the
          #    source -- then normalise the spelling and compare once. A path
          #    appearing anywhere else in the file still cannot satisfy it.
          src_raw="$(printf '%s\n' "$live" | awk '
            /\$SSH_USER@\$SSH_HOST/ { print prev; exit }
            /[^[:space:]]/         { prev = $0 }
          ')"
          src="$(printf '%s' "$src_raw" \
            | sed -e 's/[[:space:]]*\\[[:space:]]*$//' \
                  -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                  -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/")"
          src="${src#\$GITHUB_WORKSPACE/}"
          src="${src#\$\{GITHUB_WORKSPACE\}/}"
          while [ "${src#./}" != "$src" ]; do src="${src#./}"; done
          src="$(printf '%s' "$src" | sed -e 's#/\./#/#g' -e 's#/\.$#/#')"
          if [ "$src" = "site/" ]; then
            echo "ok: rsync source is site/, so the deploy is an allowlist"
          else
            echo "FAIL: the deploy rsync source is '${src:-not found}', not 'site/'."
            echo "      site/ is what makes the deploy an allowlist: only files"
            echo "      inside it can reach the web root. Any root-relative source"
            echo "      makes it a denylist again, where a new file at the"
            echo "      repository root is published unless someone remembers an"
            echo "      --exclude. That shape is what published .git/config."
            rc=1
          fi

          # 5. The push paths filter must still cover what the rsync publishes.
          #
          #    The deploy trigger is now an allowlist (site/** plus the deploy
          #    workflow itself). The regression this defends is not someone
          #    deleting the filter -- that only makes deploys noisy again, which
          #    is loud. It is someone moving the rsync source (site/ -> public/)
          #    and leaving the filter reading site/**, after which every content
          #    change is filtered out and the deploy simply never runs. Nothing
          #    turns red: the site keeps serving the last deployed bytes, and the
          #    repository and production diverge silently for as long as nobody
          #    loads a page they just changed. Property 4 pins the source and this
          #    pins the filter to it, so the pair cannot drift apart.
          #
          #    paths-ignore is rejected outright rather than merely discouraged.
          #    A denylist trigger is correct only until the next path is added
          #    and gives no signal at the moment it stops being correct -- the
          #    same shape that published .git/config.
          pf="$(printf '%s\n' "$live" | awk '
            /^[ \t]*paths-ignore:/          { print "__PATHS_IGNORE__" }
            /^[ \t]*paths:[ \t]*$/          { inp=1; next }
            inp==1 && /^[ \t]*-[ \t]*[^ \t]/ {
                                              s=$0
                                              sub(/^[ \t]*-[ \t]*/, "", s)
                                              gsub(/[\047\042]/, "", s)
                                              sub(/[ \t]+$/, "", s)
                                              print s
                                              next
                                            }
            inp==1 && /[^ \t]/             { inp=0 }
          ')"

          if printf '%s\n' "$pf" | grep -qxF -- '__PATHS_IGNORE__'; then
            echo "FAIL: the deploy trigger uses paths-ignore."
            echo "      paths-ignore is a denylist: every path not named in it"
            echo "      triggers a deploy, so it is correct only until the next"
            echo "      file is added and says nothing when it stops being."
            echo "      Use paths: (an allowlist) naming what the rsync sends."
            rc=1
          elif [ -z "$pf" ]; then
            echo "FAIL: the deploy push trigger has no paths: filter."
            echo "      $wf is expected to deploy only when the published tree or"
            echo "      the deploy itself changes. If removing the filter is"
            echo "      deliberate, this check has to be removed deliberately too."
            rc=1
          else
            # $src was normalised to the rsync source above (expected: site/).
            #
            # -F is load-bearing, not defensive. Without it these are regexes:
            # 'site/**' has * as a quantifier, so it does not match the literal
            # two asterisks it is looking for -- the arm was RED on the shipped,
            # correct config until a green control caught it. And the workflow
            # path is full of unescaped dots, which would match any character
            # and accept a filter entry that merely resembles it.
            want_src="${src}**"
            miss=""
            printf '%s\n' "$pf" | grep -qxF -- "$want_src" || miss="$miss $want_src"
            printf '%s\n' "$pf" | grep -qxF -- "$wf"       || miss="$miss $wf"
            if [ -z "$miss" ]; then
              echo "ok: deploy paths filter covers the rsync source ($want_src) and $wf"
            else
              echo "FAIL: the deploy paths: filter does not cover:$miss"
              echo "      The rsync source is '${src}', so the filter must contain"
              echo "      '${want_src}' or content changes will not trigger a deploy."
              echo "      It must also contain '$wf', or a change to the rsync"
              echo "      flags ships without ever being executed."
              echo "      Observed filter entries:"
              printf '%s\n' "$pf" | sed 's/^/        /'
              rc=1
            fi
          fi

          exit "$rc"
  # Separate job on purpose. It mutates .htaccess in its own checkout to prove
  # the assertion arms above can actually fail, so it must never be able to hand
  # a mutated tree to anything that ships.
  #
  # Isolation is topological, not a matter of step ordering:
  #   * deploy lives in a different workflow file (deploy-directadmin.yml) and
  #     triggers on push to main, so `needs:` cannot reach it from here --
  #     needs edges exist only between jobs in the same workflow;
  #   * this job declares no `needs:` and nothing declares `needs: mutation-matrix`;
  #   * it uploads no artifact and pushes nothing.
  # The final step byte-compares .htaccess against HEAD and fails if the harness
  # left the file mutated: a harness that exits 0 having not restored is the
  # dangerous outcome, and it must be loud rather than silent.
      - name: www must redirect to the apex, and only for the apex host
        run: |
          set -uo pipefail

          # This arm asserts BEHAVIOUR under a real Apache, not the text of the regex.
          #
          # The defect it exists for -- a missing trailing $ on the RewriteCond host
          # pattern -- was invisible to every probe that had been run against it,
          # because "Host: www.degra.af:8443 redirects" is true of the correct form
          # AND of the unanchored form. Identical observable, opposite cause. A text
          # assertion would work, but it can only catch the mutations its author
          # thought to spell out, and this file has already shipped one arm that was
          # red on a legal config because its author reasoned about syntax instead of
          # measuring behaviour. The table below is the artefact; the regex is an
          # implementation detail, and any spelling that satisfies the table passes.
          #
          # If docker or the image is unavailable this exits non-zero rather than
          # skipping. A check that silently does not run is the failure mode the
          # whole gate is built against.

          IMG="httpd:2.4"

          if ! command -v docker >/dev/null 2>&1; then
            echo "FAIL(host): docker is not available, so this arm cannot run"
            echo "            a check that cannot run must not report success"
            exit 1
          fi

          HT_B64="$(base64 -w0 site/.htaccess 2>/dev/null || base64 site/.htaccess | tr -d '\n')"

          out="$(docker run --rm -e HT_B64="$HT_B64" "$IMG" bash -c '
          set -e
          printf "%s" "$HT_B64" | base64 -d > /usr/local/apache2/htdocs/.htaccess
          printf "REAL-SITE-BODY\n" > /usr/local/apache2/htdocs/index.html
          sed -i "s/^#LoadModule rewrite_module/LoadModule rewrite_module/" /usr/local/apache2/conf/httpd.conf
          sed -i "s#AllowOverride None#AllowOverride All#" /usr/local/apache2/conf/httpd.conf
          httpd -k start
          sleep 2
          echo "MODRW $(httpd -M 2>/dev/null | grep -c rewrite || true)"
          probe() {
            exec 3<>/dev/tcp/127.0.0.1/80
            printf "GET /%s HTTP/1.1\r\nHost: %s\r\nConnection: close\r\n\r\n" "$2" "$1" >&3
            r=$(cat <&3); exec 3<&-
            c=$(printf "%s" "$r" | head -1 | awk "{print \$2}")
            l=$(printf "%s" "$r" | grep -i "^Location:" | tr -d "\r" | sed "s/^[Ll]ocation: *//")
            echo "RESULT|$1|$2|$c|$l"
          }
          probe "www.degra.af" ""
          probe "WWW.DEGRA.AF" ""
          probe "www.degra.af:8443" ""
          probe "degra.af" ""
          probe "www.degra.af.evil.example" ""
          probe "www.degra.af.evil.example" "admin"
          probe "degra.af.evil.example" ""
          ' 2>&1)" || true

          rc=0

          # Instrument checks first. A uniform table is only evidence if the
          # instrument is known to have been live when it was produced.
          if ! printf '%s' "$out" | grep -q '^MODRW [1-9]'; then
            echo "FAIL(host): mod_rewrite was not loaded in the test container"
            echo "            every request would serve 200 and the table would look clean"
            printf '%s\n' "$out" | sed 's/^/            /'
            exit 1
          fi

          apex="$(printf '%s' "$out" | grep '^RESULT|degra.af||' | cut -d'|' -f4)"
          if [ "$apex" != "200" ]; then
            echo "FAIL(host): apex control did not serve 200 (got '${apex:-nothing}')"
            echo "            .htaccess may not have been read at all"
            printf '%s\n' "$out" | sed 's/^/            /'
            exit 1
          fi

          expect() {   # $1=host $2=path $3=redirect|serve
            line="$(printf '%s' "$out" | grep "^RESULT|$1|$2|")"
            if [ -z "$line" ]; then
              echo "FAIL(host): no result for Host:$1 /$2"
              rc=1
              return
            fi
            code="$(printf '%s' "$line" | cut -d'|' -f4)"
            loc="$(printf '%s' "$line" | cut -d'|' -f5)"
            case "$3" in
              redirect)
                if [ "$code" != "301" ]; then
                  echo "FAIL(host): Host:$1 /$2 should 301 to the apex, got $code"
                  rc=1
                elif [ "${loc#https://degra.af/}" = "$loc" ]; then
                  # The target must be the literal apex. If someone rewrites it to
                  # use %{HTTP_HOST} this becomes an open redirect, and that is a
                  # strictly worse bug than the one being fixed.
                  echo "FAIL(host): Host:$1 /$2 redirected to '$loc', not the literal apex"
                  rc=1
                else
                  echo "  ok   Host:$1 /$2 -> $code $loc"
                fi
                ;;
              serve)
                if [ "$code" = "301" ]; then
                  echo "FAIL(host): Host:$1 /$2 was redirected to '$loc' but must be served"
                  rc=1
                else
                  echo "  ok   Host:$1 /$2 -> $code (not redirected)"
                fi
                ;;
            esac
          }

          # The canonical redirect must fire for the www host, with or without a port,
          # and case-insensitively.
          expect "www.degra.af"      ""      redirect
          expect "WWW.DEGRA.AF"      ""      redirect
          expect "www.degra.af:8443" ""      redirect

          # ...and must NOT fire for anything else. The apex serves itself, and a
          # hostname that merely begins with the www host is not the www host.
          expect "degra.af"                  ""      serve
          expect "www.degra.af.evil.example" ""      serve
          expect "www.degra.af.evil.example" "admin" serve
          expect "degra.af.evil.example"     ""      serve

          if [ "$rc" -ne 0 ]; then
            echo
            echo "full table:"
            printf '%s\n' "$out" | grep '^RESULT' | sed 's/^/  /'
          fi

          exit "$rc"

      - name: the dotfile denial must deny a file that is actually there
        run: |
          set -uo pipefail

          # Layer 2 of the .git protection, tested against a PRESENT file.
          #
          # There are two independent defences against publishing a checkout:
          #   1. the deploy rsync publishes site/ only (an allowlist)
          #   2. .htaccess returns 404 for dotfiles and dot-directories
          #
          # Every existing check covers layer 1. Nothing covered layer 2 against
          # a file that exists, and production structurally cannot: .git is
          # correctly absent there, so the live probe
          #
          #     curl -o /dev/null -w '%{http_code}' https://degra.af/.git/config
          #       -> 404
          #
          # returns 404 because the rule fires on the URI, not because the file
          # is missing -- and it would return 404 either way. That probe has
          # been cited (by me, more than once) as evidence the leak is closed.
          # It is not evidence: it cannot distinguish the state we want from the
          # state we fixed. This arm is the instrument that can, because a
          # container can put the file back.
          #
          # The measurement that makes the 404 mean something is phase 2: with
          # .htaccess removed the same URL must serve 200 and the file's own
          # body. Without that, "404 for a present file" is indistinguishable
          # from a fixture that never landed -- the same shape as asserting a
          # mutation applied instead of asserting the construct it produced.

          IMG="httpd:2.4"

          if ! command -v docker >/dev/null 2>&1; then
            echo "FAIL(host): docker is not available, so this arm cannot run"
            echo "            a check that cannot run must not report success"
            exit 1
          fi

          HT_B64="$(base64 -w0 site/.htaccess 2>/dev/null || base64 site/.htaccess | tr -d '\n')"

          out="$(docker run --rm -e HT_B64="$HT_B64" "$IMG" bash -c '
          set -e
          D=/usr/local/apache2/htdocs
          printf "%s" "$HT_B64" | base64 -d > "$D/.htaccess"
          printf "REAL-SITE-BODY\n" > "$D/index.html"

          # The leak, reconstructed. Same path that was live on this domain.
          mkdir -p "$D/.git"
          printf "PRESENT-GIT-CONFIG-BODY\n" > "$D/.git/config"
          printf "PRESENT-DOTFILE-BODY\n"    > "$D/.gitignore"

          sed -i "s/^#LoadModule rewrite_module/LoadModule rewrite_module/" /usr/local/apache2/conf/httpd.conf
          sed -i "s#AllowOverride None#AllowOverride All#" /usr/local/apache2/conf/httpd.conf
          httpd -k start
          sleep 2
          echo "MODRW $(httpd -M 2>/dev/null | grep -c rewrite || true)"

          probe() {
            exec 3<>/dev/tcp/127.0.0.1/80
            printf "GET /%s HTTP/1.1\r\nHost: degra.af\r\nConnection: close\r\n\r\n" "$2" >&3
            r=$(cat <&3); exec 3<&-
            c=$(printf "%s" "$r" | head -1 | awk "{print \$2}")
            m=no
            if printf "%s" "$r" | grep -q "PRESENT-GIT-CONFIG-BODY"; then m=yes; fi
            echo "RESULT|$1|$2|$c|$m"
          }

          # Phase 1: shipped .htaccess in place. The files exist.
          probe P1 ".git/config"
          probe P1 ".gitignore"
          probe P1 ".absent-canary-xyz"
          probe P1 ""

          # Phase 2: the rule removed. Same files, same request. This is the
          # control that proves phase 1 measured a denial and not an absence.
          rm -f "$D/.htaccess"
          httpd -k restart
          sleep 2
          probe P2 ".git/config"
          ' 2>&1)" || true

          rc=0
          get() { printf '%s' "$out" | grep "^RESULT|$1|$2|" | cut -d"|" -f4; }
          mark() { printf '%s' "$out" | grep "^RESULT|$1|$2|" | cut -d"|" -f5; }

          # --- instrument checks, before any conclusion is drawn -------------
          if ! printf '%s' "$out" | grep -q '^MODRW [1-9]'; then
            echo "FAIL(host): mod_rewrite was not loaded in the test container"
            echo "            the dotfile rule is a RewriteRule, so it would not"
            echo "            have run and every denial below would be fake"
            printf '%s\n' "$out" | sed 's/^/            /'
            exit 1
          fi

          idx="$(get P1 "")"
          if [ "$idx" != "200" ]; then
            echo "FAIL(host): index control did not serve 200 (got '${idx:-nothing}')"
            echo "            .htaccess may not have been read at all"
            printf '%s\n' "$out" | sed 's/^/            /'
            exit 1
          fi

          p2="$(get P2 ".git/config")"
          p2m="$(mark P2 ".git/config")"
          if [ "$p2" != "200" ] || [ "$p2m" != "yes" ]; then
            echo "FAIL(host): with .htaccess removed, /.git/config did not serve"
            echo "            its own body (code '${p2:-nothing}', body marker '${p2m:-nothing}')."
            echo "            The fixture never landed, so phase 1 proves nothing:"
            echo "            a 404 for a file that was never created is not a denial."
            printf '%s\n' "$out" | sed 's/^/            /'
            exit 1
          fi
          echo "ok   instrument: /.git/config IS present and servable (P2 200, own body)"

          # --- the property ---------------------------------------------------
          for f in ".git/config" ".gitignore"; do
            c="$(get P1 "$f")"
            m="$(mark P1 "$f")"
            if [ "$c" = "200" ] || [ "$m" = "yes" ]; then
              echo "FAIL: /$f is PRESENT and .htaccess served it (code '$c', body leaked '$m')."
              echo "      This is the state that published a deploy credential."
              rc=1
            else
              echo "ok   /$f present on disk, denied by .htaccess (code $c, body not leaked)"
            fi
          done

          # --- what this says about the live probe ----------------------------
          # Recorded, not asserted as a preference: the point is that these two
          # are equal, which is exactly why the external probe cannot tell them
          # apart. If a future change made them differ, that would be worth
          # knowing, so it is printed either way.
          present="$(get P1 ".git/config")"
          absent="$(get P1 ".absent-canary-xyz")"
          echo "note present-dotfile -> $present   absent-dotfile -> $absent"
          if [ "$present" = "$absent" ]; then
            echo "note identical, so 'curl https://degra.af/.git/config -> 404' has NO"
            echo "     power to detect a re-published checkout. The instruments that do"
            echo "     are this arm, the rsync source allowlist, and the deploy log."
          fi

          if [ "$rc" -ne 0 ]; then
            echo
            echo "full table:"
            printf '%s\n' "$out" | grep '^RESULT' | sed 's/^/  /'
          fi

          exit "$rc"

  mutation-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Run the .htaccess mutation matrix
        run: python3 .github/gates/mutation_matrix.py

      - name: mutated files must be byte-identical to HEAD afterwards
        if: always()
        run: |
          set -euo pipefail

          # Runs even if the matrix failed: a failing matrix is the case most
          # likely to have exited early and left a file mutated. Covers every
          # artefact any fixture touches, not just .htaccess -- the deploy
          # workflow is now mutated too, and a harness that left THAT rewritten
          # would be the more dangerous of the two.
          rc=0
          for f in site/.htaccess .github/workflows/deploy-directadmin.yml; do
            # Name the drift explicitly. Without this, a path that has moved
            # fails as `fatal: path ... exists on disk, but not in 'HEAD'` via
            # set -e, which is red -- correctly -- but reads as a git problem
            # rather than as "this list no longer matches the tree". The site
            # assets moved into site/ once already.
            if ! expected="$(git rev-parse --verify --quiet "HEAD:$f")"; then
              echo "::error::$f is in this restoration list but not in HEAD."
              echo "  The list has drifted from the tree. It is not safe to"
              echo "  report restoration as verified for a path that cannot be"
              echo "  compared, so this is a failure rather than a skip."
              rc=1
              continue
            fi
            actual="$(git hash-object "$f")"
            echo "$f"
            echo "  expected blob: $expected"
            echo "  actual blob:   $actual"
            if [ "$expected" != "$actual" ]; then
              echo "::error::$f was not restored after the mutation matrix."
              git --no-pager diff -- "$f" || true
              rc=1
            fi
          done

          if [ "$rc" -ne 0 ]; then
            echo "The working tree differs from HEAD. Nothing here reaches the"
            echo "deploy path, but a harness that fails to restore is a defect"
            echo "in the harness and must not pass quietly."
            exit 1
          fi

          echo "ok: all mutated files restored byte-for-byte"

  # Separate job, deliberately, and for the same reason as mutation-matrix
  # above: it builds mutated .htaccess fixtures to prove the reach arm fires,
  # and nothing that mutates config may sit on a path that can reach a deploy.
  #
  # Isolation is topological, not a matter of ordering. This job declares no
  # `needs:`, nothing declares `needs: gate-selftest`, it uploads no artifact
  # and pushes nothing, and deploy lives in a different workflow file
  # (deploy-directadmin.yml) triggered by push to main -- `needs:` edges exist
  # only between jobs in the same workflow, so no edit to this file can put a
  # fixture on a path to a deploy.
  #
  # Stronger than restoring: this harness never writes to the working tree at
  # all. Every fixture is a copy in a scratch directory, so the failure mode
  # where a mutation lands, the script dies under `set -e` before the restore,
  # and the mutated config gets committed has no foothold. The run still ends
  # by comparing .htaccess against git show HEAD:.htaccess and failing loudly
  # if it moved.
  gate-selftest:
    name: Prove the robots.txt reach gate fires
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Negative-test the robots-txt-not-retyped check
        run: bash .github/checks/htaccess-content-type-scope.selftest.sh

  # security.txt expiry is deliberately NOT a step in `validate`, and not in the
  # mutation matrix either. Both of those are instruments for properties that
  # break when someone edits a file. This property breaks on a date, with no
  # commit, so its real instrument is .github/workflows/securitytxt-validity.yml
  # on a schedule. FAILURE-SHAPES.md #9.
  #
  # What the PR-time arm below is FOR is the different and narrower class the
  # scheduled job cannot catch quickly: a value typed into the past, or into a
  # spelling no RFC 9116 consumer can read, arriving in a pull request. It is
  # worth having and it is not the control that closes the hole. Saying so here
  # matters, because an arm whose scope is misremembered is an arm someone later
  # deletes the scheduled job on the strength of.
  securitytxt-expiry:
    name: security.txt Expires is valid, and the checker fires
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # No npm ci: the checker has no dependencies.
      - name: The committed security.txt is not expired or expiring
        run: node .github/checks/securitytxt-expiry.mjs --file site/.well-known/security.txt

      # And the arm above must be capable of going red. This mutates the file,
      # requires a specific marker per red row, restores from an in-memory
      # snapshot, and fails if either polarity is missing from either layer.
      - name: Negative-test the expiry checker
        run: node .github/checks/test-securitytxt-expiry.mjs
