name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: HSTS header must not advertise preload consent
        run: |
          set -euo pipefail

          # Inspect only the live directive, never the surrounding comments
          # (which mention `preload` by name while explaining its absence).
          line="$(grep -E '^[[:space:]]*Header[[:space:]]+always[[:space:]]+set[[:space:]]+Strict-Transport-Security' .htaccess || true)"

          if [ -z "$line" ]; then
            echo "FAIL: no 'Header always set Strict-Transport-Security' directive in .htaccess"
            exit 1
          fi

          count="$(printf '%s\n' "$line" | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "FAIL: expected exactly 1 Strict-Transport-Security directive, found $count"
            printf '%s\n' "$line"
            exit 1
          fi

          echo "directive: $line"
          rc=0

          case "$line" in
            *max-age=31536000*) echo "ok: max-age=31536000 present" ;;
            *) echo "FAIL: max-age=31536000 missing or changed"; rc=1 ;;
          esac

          case "$line" in
            *includeSubDomains*) echo "ok: includeSubDomains present" ;;
            *) echo "FAIL: includeSubDomains missing"; rc=1 ;;
          esac

          case "$line" in
            *preload*)
              echo "FAIL: 'preload' directive present in the HSTS header."
              echo "      This is a consent flag: anyone may submit an eligible domain"
              echo "      advertising it to the Chrome HSTS preload list, and removal is"
              echo "      slow. Sibling domain geertdegraaf.nl is already status=removed."
              echo "      Dropping it is not a downgrade - max-age and includeSubDomains"
              echo "      still enforce HTTPS. See the comment block in .htaccess."
              rc=1
              ;;
            *) echo "ok: 'preload' absent" ;;
          esac

          exit "$rc"

      - name: mod_rewrite must be enabled in the top-level context
        run: |
          set -euo pipefail

          # Guards against a silent failure mode: without `RewriteEngine On`,
          # mod_rewrite ignores every Rewrite* line in this file. There is no
          # error, no log entry and no 5xx -- the rules stay textually perfect
          # and become permanently inert, so the www -> apex redirect simply
          # stops working while the config still reviews as correct.
          #
          # This is a realised copy-propagation risk, not a hypothetical: the
          # redirect from this file was circulated to sibling repos with the
          # directive stripped, and was caught by hand once. The next copy is
          # the one nobody catches.
          #
          # Deliberately NOT asserted:
          #
          #   Ordering. It is tempting to require `RewriteEngine On` before the
          #   first Rewrite* line, because that is how the file reads. But the
          #   directive is a per-context configuration flag settled when httpd
          #   merges the config, not a sequential switch -- within one context
          #   the last value wins regardless of where the rules sit relative to
          #   it. An ordering arm would be stricter than the server and would
          #   one day go red on a file that works.
          #
          #   Count. This file legitimately sets the directive twice: once at
          #   the top level and once inside <IfModule mod_rewrite.c>. An
          #   "exactly one" arm would go red on the current, deployed, working
          #   configuration -- a gate whose first firing is guaranteed wrong.
          #
          # Red on a working file is the expensive failure: it teaches people to
          # edit the gate, so it gets deleted rather than debugged, costing the
          # coverage it was added to provide.
          #
          # Why this is modelled as STATE and not as a line being present:
          # a presence check reads `RewriteEngine On` followed later by
          # `RewriteEngine Off` as fine. Tracking the value through the parse
          # makes catching that automatic rather than a second clause somebody
          # has to remember to implement -- and it is the clause most likely to
          # be dropped, because the first half is the one that reads like the
          # requirement.
          #
          # Why the state model tracks <IfModule> scope rather than being flat:
          # a flat last-value-wins model is NOT a safe simplification for this
          # file. .htaccess sets the directive twice, and the second one lives
          # inside <IfModule mod_rewrite.c>. Delete the top-level directive --
          # exactly the copy-propagation mutation this gate exists to catch --
          # and a flat model still reports effective=on from the nested one and
          # passes, while the www -> apex rule at the top level is inert.
          # Verified against this file: the flat model returns PASS on that
          # mutation, the scoped model below returns FAIL.

          # Resolve the effective TOP-LEVEL setting the way httpd does: track
          # container nesting, ignore anything inside a <Section>, and let the
          # last value in the top-level context win.
          scan="$(awk '
            { line = $0 }

            # Strip whole-line comments. A commented-out directive must not
            # satisfy the gate, and a comment mentioning <IfModule> must not
            # shift the nesting depth. Apache treats a trailing # as literal,
            # so only leading-# lines are comments.
            { sub(/^[ \t]*#.*$/, "", line) }

            line ~ /^[ \t]*<\/[A-Za-z]/ { depth--; next }
            line ~ /^[ \t]*<[A-Za-z]/   { depth++; next }

            {
              l = tolower(line)
              if (depth == 0) {
                if (l ~ /^[ \t]*rewriteengine[ \t]+on[ \t]*$/)       { seen_on = 1; last = "on" }
                else if (l ~ /^[ \t]*rewriteengine[ \t]+off[ \t]*$/) { last = "off" }
              }
            }

            END { printf "%s %s\n", (seen_on ? "yes" : "no"), (last == "" ? "unset" : last) }
          ' .htaccess)"

          seen_on="${scan%% *}"
          effective="${scan##* }"

          echo "top-level RewriteEngine: present=$seen_on effective=$effective"

          # Report every arm before exiting: a checker that stops at the first
          # failure hides the state of the arms after it.
          rc=0

          if [ "$seen_on" = "yes" ]; then
            echo "ok: 'RewriteEngine On' present in the top-level context"
          else
            echo "FAIL: no 'RewriteEngine On' in the top-level context of .htaccess."
            echo "      mod_rewrite will ignore every Rewrite* line in this file."
            echo "      The www -> apex redirect becomes inert with no error and"
            echo "      no log entry. A nested directive inside <IfModule> does"
            echo "      not enable the rules that live at the top level."
            rc=1
          fi

          if [ "$effective" = "off" ]; then
            echo "FAIL: the top-level RewriteEngine is effectively Off."
            echo "      A later 'RewriteEngine Off' in the same context wins over"
            echo "      an earlier On, disabling the rules regardless of position."
            rc=1
          else
            echo "ok: top-level RewriteEngine is not switched Off"
          fi

          exit "$rc"

      - name: security.txt must be served as text/plain with charset=utf-8
        run: |
          set -euo pipefail

          # RFC 9116 section 3 requires "text/plain; charset=utf-8". Apache's
          # mime.types gives .txt a bare text/plain, so this has to be set.
          #
          # The value is asserted, not merely the directive's existence. A bare
          # ForceType "text/plain" is textually present and behaviourally
          # identical to the bug, so a "a ForceType exists" arm would pass in
          # the exact state being fixed -- the same shape as an "an HSTS header
          # exists" arm passing while it still advertises preload.

          scan="$(awk '
            { line = $0; sub(/^[ \t]*#.*$/, "", line); l = tolower(line) }

            l ~ /^[ \t]*<files[ \t]+"?security\.txt"?[ \t]*>/ { inblock = 1; next }
            l ~ /^[ \t]*<\/files[ \t]*>/                      { inblock = 0; next }

            inblock && l ~ /^[ \t]*forcetype[ \t]/ {
              arg = line
              sub(/^[ \t]*[^ \t]+[ \t]+/, "", arg)   # drop the directive name
              sub(/[ \t]+$/, "", arg)
              found = 1
            }

            END { printf "%s|%s\n", (found ? "yes" : "no"), arg }
          ' .htaccess)"

          found="${scan%%|*}"
          arg="${scan#*|}"
          lower_arg="$(printf '%s' "$arg" | tr '[:upper:]' '[:lower:]')"

          echo "ForceType in <Files \"security.txt\">: found=$found value=$arg"

          rc=0

          if [ "$found" = "yes" ]; then
            echo "ok: ForceType present for security.txt"
          else
            echo "FAIL: no ForceType for security.txt in .htaccess."
            echo "      Apache serves .txt as a bare text/plain, which does not"
            echo "      satisfy RFC 9116 section 3."
            rc=1
          fi

          case "$lower_arg" in
            *text/plain*) echo "ok: media type is text/plain" ;;
            *) echo "FAIL: media type is not text/plain (got: $arg)"; rc=1 ;;
          esac

          case "$lower_arg" in
            *charset=utf-8*)
              echo "ok: charset=utf-8 present"
              ;;
            *)
              echo "FAIL: the ForceType value does not carry charset=utf-8."
              echo "      A bare text/plain is textually present and behaviourally"
              echo "      identical to having no ForceType at all. RFC 9116"
              echo "      section 3 requires the charset."
              rc=1
              ;;
          esac

          # Deliberately NOT asserted: quote style. The file uses double quotes
          # for consistency with every other quoted argument, but a single-quoted
          # argument was measured against Apache 2.4.68 and works -- correct
          # Content-Type, site root still 200, nothing in the error log. Gating
          # style would put the gate red on a working configuration, which is the
          # failure that teaches people to edit gates rather than debug them.

          exit "$rc"

      - name: security.txt content-type must not leak onto other .txt files
        run: |
          set -euo pipefail

          # Blast radius. The intuitive way to satisfy RFC 9116 is
          #
          #   AddType "text/plain; charset=utf-8" .txt
          #
          # which is shorter and reads better than a <Files> container -- and
          # measured against Apache 2.4.68 it also retypes robots.txt. Every
          # other arm in this job stays green in that state, because
          # security.txt does get the right header. The change is correct about
          # its target and wrong about its scope.
          #
          # This arm is why <Files "security.txt"> is load-bearing rather than
          # tidy. It asserts that no content-type-setting directive applies more
          # broadly than that one file: nothing at the top level, and nothing in
          # a container whose pattern is wider than the file it is meant for.
          #
          # Corrected after this arm rejected a legal configuration. It used to
          # flag AddType even inside <Files "security.txt">, reasoning that
          # AddType maps an extension rather than a file. The premise is true and
          # the conclusion does not follow: <Files> restricts which *requests* a
          # directive applies to, which is independent of whether the directive
          # maps an extension. Measured on Apache 2.4.68, with a negative control
          # first so the instrument was proven before it was believed:
          #
          #   AllowOverride None    security.txt text/plain
          #                         robots.txt   text/plain    (.htaccess ignored)
          #   A top-level AddType   security.txt text/plain; charset=utf-8
          #                         robots.txt   text/plain; charset=utf-8  RETYPED
          #                         pgp.txt      text/plain; charset=utf-8  RETYPED
          #   B AddType in <Files>  security.txt text/plain; charset=utf-8
          #                         robots.txt   text/plain    NOT retyped
          #                         pgp.txt      text/plain    NOT retyped
          #   C ForceType in <Files> identical to B             (what ships)
          #
          # Row B carries its own positive control: if <Files> were being ignored
          # wholesale, security.txt would be bare too. It is not -- the directive
          # fired AND was scoped. So A stays gated and B is legal.
          #
          # The failure this arm had is the flattering one. An over-strict gate is
          # red on things it should not be, so its 18 red arms read as thoroughness
          # while it quietly narrowed what Apache permits. None of the green
          # controls covered a legal AddType, because the arm and its fixtures were
          # written by the same author holding the same wrong belief -- a green
          # control only defends the legality somebody thought to write down.

          scan="$(awk '
            { line = $0; sub(/^[ \t]*#.*$/, "", line); l = tolower(line) }

            # Track container nesting and remember whether the container we are
            # inside is the narrow security.txt one.
            l ~ /^[ \t]*<files[ \t]+"?security\.txt"?[ \t]*>/ { depth++; narrow = 1; next }
            l ~ /^[ \t]*<(files|filesmatch|directory|location|locationmatch)[ \t]/ {
              depth++; narrow = 0; next
            }
            l ~ /^[ \t]*<\/(files|filesmatch|directory|location|locationmatch)[ \t]*>/ {
              depth--; if (depth < 1) narrow = 0; next
            }

            # Directives that decide or overwrite the response content type.
            l ~ /^[ \t]*(forcetype|defaulttype)[ \t]/ ||
            l ~ /^[ \t]*addtype[ \t]/ ||
            l ~ /^[ \t]*header[ \t]+(always[ \t]+)?set[ \t]+content-type[ \t]/ {
              # Inside <Files "security.txt"> the request set is already the one
              # file, whatever the directive maps. Measured, not inferred.
              if (narrow) next
              bad = bad (bad ? " | " : "") $0
              sub(/^[ \t]+/, "", bad)
            }

            END { print bad }
          ' .htaccess)"

          if [ -z "$scan" ]; then
            echo "ok: no content-type directive reaches beyond security.txt"
            exit 0
          fi

          echo "FAIL: a content-type directive applies beyond security.txt."
          echo "      offending: $scan"
          echo ""
          echo "      Measured on Apache 2.4.68: AddType on .txt retypes"
          echo "      robots.txt as well, and every other arm in this job stays"
          echo "      green while it does -- security.txt really does get the"
          echo "      right header. Keep the directive inside"
          echo "      <Files \"security.txt\"> so the scope matches the intent."
          exit 1

      - name: deploy must not publish .git or .github
        run: |
          set -euo pipefail

          # The deploy rsyncs the repository root to a public web root. Without
          # exclusions that publishes .git, and actions/checkout writes an
          # `AUTHORIZATION: basic <base64>` extraheader into .git/config when
          # persist-credentials is left at its default of true.
          #
          # Confirmed by probing production rather than reading the YAML: files
          # that are repository content and not site content were live --
          # /README.md 200, /LICENSE 200, /SECURITY.md 200 -- so the root really
          # is mirrored. /.git/config returned 404, but a 404 is evidence that
          # something answered, not that the file is absent: .htaccess has a
          # single RewriteRule masking dotfiles. That rule stays as the second
          # layer. It is not sufficient as the first, because it asserts a repo
          # file while the property depends on mod_rewrite being loaded and
          # AllowOverride still being granted on the host -- both of which can
          # change with this gate staying green.
          #
          # Three properties, asserted separately because they fail
          # independently and each is one edit from regression.

          wf=".github/workflows/deploy-directadmin.yml"
          rc=0

          # Read only the directives, never the prose. The comment block in
          # the deploy workflow explains these flags and necessarily names
          # them, so a file-wide grep could be satisfied by the very text
          # arguing for them -- a gate defeated by its own documentation.
          # Strip whole-line comments first and assert against what is left.
          # Verified with a fixture that comments the directives out.
          live="$(sed 's/^[[:space:]]*#.*$//' "$wf")"

          # 1. The credential must not be written into the checkout at all.
          if printf '%s' "$live" | grep -qE '^[[:space:]]*persist-credentials:[[:space:]]*false[[:space:]]*$'; then
            echo "ok: deploy checkout sets persist-credentials: false"
          else
            echo "FAIL: the deploy checkout does not set persist-credentials: false."
            echo "      actions/checkout defaults it to true and writes an"
            echo "      AUTHORIZATION extraheader into .git/config, which the"
            echo "      rsync below copies to a public web root."
            rc=1
          fi

          # 2. It must not be copied even if it is written.
          missing=""
          for pat in "--exclude='.git'" "--exclude='.github'"; do
            printf '%s' "$live" | grep -qF -- "$pat" || missing="$missing $pat"
          done
          if [ -z "$missing" ]; then
            echo "ok: rsync excludes .git and .github"
          else
            echo "FAIL: the deploy rsync is missing exclusions:$missing"
            echo "      The repository root is rsynced to a public web root, so"
            echo "      anything not excluded is published."
            rc=1
          fi

          # 3. Excluding is not removing. Measured with rsync:
          #      --delete --exclude=.git                  dst/.git/config PRESENT
          #      --delete --delete-excluded --exclude=.git dst/.git/config gone
          #    Without --delete-excluded a .git already on the server is
          #    protected from --delete and survives every future deploy.
          if printf '%s' "$live" | grep -qF -- "--delete-excluded"; then
            echo "ok: rsync uses --delete-excluded, so an already-published .git is removed"
          else
            echo "FAIL: the deploy rsync excludes .git but does not use --delete-excluded."
            echo "      rsync protects excluded paths on the receiving side from"
            echo "      --delete, so a .git directory already on the server would"
            echo "      survive indefinitely. Excluding is not removing."
            rc=1
          fi

          exit "$rc"
  # Separate job on purpose. It mutates .htaccess in its own checkout to prove
  # the assertion arms above can actually fail, so it must never be able to hand
  # a mutated tree to anything that ships.
  #
  # Isolation is topological, not a matter of step ordering:
  #   * deploy lives in a different workflow file (deploy-directadmin.yml) and
  #     triggers on push to main, so `needs:` cannot reach it from here --
  #     needs edges exist only between jobs in the same workflow;
  #   * this job declares no `needs:` and nothing declares `needs: mutation-matrix`;
  #   * it uploads no artifact and pushes nothing.
  # The final step byte-compares .htaccess against HEAD and fails if the harness
  # left the file mutated: a harness that exits 0 having not restored is the
  # dangerous outcome, and it must be loud rather than silent.
      - name: www must redirect to the apex, and only for the apex host
        run: |
          set -uo pipefail

          # This arm asserts BEHAVIOUR under a real Apache, not the text of the regex.
          #
          # The defect it exists for -- a missing trailing $ on the RewriteCond host
          # pattern -- was invisible to every probe that had been run against it,
          # because "Host: www.degra.af:8443 redirects" is true of the correct form
          # AND of the unanchored form. Identical observable, opposite cause. A text
          # assertion would work, but it can only catch the mutations its author
          # thought to spell out, and this file has already shipped one arm that was
          # red on a legal config because its author reasoned about syntax instead of
          # measuring behaviour. The table below is the artefact; the regex is an
          # implementation detail, and any spelling that satisfies the table passes.
          #
          # If docker or the image is unavailable this exits non-zero rather than
          # skipping. A check that silently does not run is the failure mode the
          # whole gate is built against.

          IMG="httpd:2.4"

          if ! command -v docker >/dev/null 2>&1; then
            echo "FAIL(host): docker is not available, so this arm cannot run"
            echo "            a check that cannot run must not report success"
            exit 1
          fi

          HT_B64="$(base64 -w0 .htaccess 2>/dev/null || base64 .htaccess | tr -d '\n')"

          out="$(docker run --rm -e HT_B64="$HT_B64" "$IMG" bash -c '
          set -e
          printf "%s" "$HT_B64" | base64 -d > /usr/local/apache2/htdocs/.htaccess
          printf "REAL-SITE-BODY\n" > /usr/local/apache2/htdocs/index.html
          sed -i "s/^#LoadModule rewrite_module/LoadModule rewrite_module/" /usr/local/apache2/conf/httpd.conf
          sed -i "s#AllowOverride None#AllowOverride All#" /usr/local/apache2/conf/httpd.conf
          httpd -k start
          sleep 2
          echo "MODRW $(httpd -M 2>/dev/null | grep -c rewrite || true)"
          probe() {
            exec 3<>/dev/tcp/127.0.0.1/80
            printf "GET /%s HTTP/1.1\r\nHost: %s\r\nConnection: close\r\n\r\n" "$2" "$1" >&3
            r=$(cat <&3); exec 3<&-
            c=$(printf "%s" "$r" | head -1 | awk "{print \$2}")
            l=$(printf "%s" "$r" | grep -i "^Location:" | tr -d "\r" | sed "s/^[Ll]ocation: *//")
            echo "RESULT|$1|$2|$c|$l"
          }
          probe "www.degra.af" ""
          probe "WWW.DEGRA.AF" ""
          probe "www.degra.af:8443" ""
          probe "degra.af" ""
          probe "www.degra.af.evil.example" ""
          probe "www.degra.af.evil.example" "admin"
          probe "degra.af.evil.example" ""
          ' 2>&1)" || true

          rc=0

          # Instrument checks first. A uniform table is only evidence if the
          # instrument is known to have been live when it was produced.
          if ! printf '%s' "$out" | grep -q '^MODRW [1-9]'; then
            echo "FAIL(host): mod_rewrite was not loaded in the test container"
            echo "            every request would serve 200 and the table would look clean"
            printf '%s\n' "$out" | sed 's/^/            /'
            exit 1
          fi

          apex="$(printf '%s' "$out" | grep '^RESULT|degra.af||' | cut -d'|' -f4)"
          if [ "$apex" != "200" ]; then
            echo "FAIL(host): apex control did not serve 200 (got '${apex:-nothing}')"
            echo "            .htaccess may not have been read at all"
            printf '%s\n' "$out" | sed 's/^/            /'
            exit 1
          fi

          expect() {   # $1=host $2=path $3=redirect|serve
            line="$(printf '%s' "$out" | grep "^RESULT|$1|$2|")"
            if [ -z "$line" ]; then
              echo "FAIL(host): no result for Host:$1 /$2"
              rc=1
              return
            fi
            code="$(printf '%s' "$line" | cut -d'|' -f4)"
            loc="$(printf '%s' "$line" | cut -d'|' -f5)"
            case "$3" in
              redirect)
                if [ "$code" != "301" ]; then
                  echo "FAIL(host): Host:$1 /$2 should 301 to the apex, got $code"
                  rc=1
                elif [ "${loc#https://degra.af/}" = "$loc" ]; then
                  # The target must be the literal apex. If someone rewrites it to
                  # use %{HTTP_HOST} this becomes an open redirect, and that is a
                  # strictly worse bug than the one being fixed.
                  echo "FAIL(host): Host:$1 /$2 redirected to '$loc', not the literal apex"
                  rc=1
                else
                  echo "  ok   Host:$1 /$2 -> $code $loc"
                fi
                ;;
              serve)
                if [ "$code" = "301" ]; then
                  echo "FAIL(host): Host:$1 /$2 was redirected to '$loc' but must be served"
                  rc=1
                else
                  echo "  ok   Host:$1 /$2 -> $code (not redirected)"
                fi
                ;;
            esac
          }

          # The canonical redirect must fire for the www host, with or without a port,
          # and case-insensitively.
          expect "www.degra.af"      ""      redirect
          expect "WWW.DEGRA.AF"      ""      redirect
          expect "www.degra.af:8443" ""      redirect

          # ...and must NOT fire for anything else. The apex serves itself, and a
          # hostname that merely begins with the www host is not the www host.
          expect "degra.af"                  ""      serve
          expect "www.degra.af.evil.example" ""      serve
          expect "www.degra.af.evil.example" "admin" serve
          expect "degra.af.evil.example"     ""      serve

          if [ "$rc" -ne 0 ]; then
            echo
            echo "full table:"
            printf '%s\n' "$out" | grep '^RESULT' | sed 's/^/  /'
          fi

          exit "$rc"

  mutation-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Run the .htaccess mutation matrix
        run: python3 .github/gates/mutation_matrix.py

      - name: mutated files must be byte-identical to HEAD afterwards
        if: always()
        run: |
          set -euo pipefail

          # Runs even if the matrix failed: a failing matrix is the case most
          # likely to have exited early and left a file mutated. Covers every
          # artefact any fixture touches, not just .htaccess -- the deploy
          # workflow is now mutated too, and a harness that left THAT rewritten
          # would be the more dangerous of the two.
          rc=0
          for f in .htaccess .github/workflows/deploy-directadmin.yml; do
            expected="$(git rev-parse "HEAD:$f")"
            actual="$(git hash-object "$f")"
            echo "$f"
            echo "  expected blob: $expected"
            echo "  actual blob:   $actual"
            if [ "$expected" != "$actual" ]; then
              echo "::error::$f was not restored after the mutation matrix."
              git --no-pager diff -- "$f" || true
              rc=1
            fi
          done

          if [ "$rc" -ne 0 ]; then
            echo "The working tree differs from HEAD. Nothing here reaches the"
            echo "deploy path, but a harness that fails to restore is a defect"
            echo "in the harness and must not pass quietly."
            exit 1
          fi

          echo "ok: all mutated files restored byte-for-byte"