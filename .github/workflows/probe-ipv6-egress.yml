name: probe-ipv6-egress

# THROWAWAY PROBE, dispatch-only. Delete this branch once the question is
# settled. It follows the precedent of probe-paths-matcher and probe-real-filter:
# when the question is "what does the platform actually do", the answer is
# measured on the platform rather than reasoned about locally.
#
# It asserts nothing and gates nothing, so it has no polarity requirement. It is
# an instrument, not a control.

# Trigger is `push` on this branch only, not workflow_dispatch. That is not a
# style choice: GitHub only exposes workflow_dispatch for workflows present on
# the DEFAULT branch, so a dispatch-only probe on a side branch cannot be run at
# all. The earlier probe-paths-matcher / probe-real-filter workflows used push
# for the same reason.
on:
  push:
    branches:
      - probe-ipv6-egress

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Three identical replicas. One run that happens to be clean proves nothing
    # about an ~11% intermittent fault; three widen the sample and, because they
    # are scheduled independently, sample different moments and hosts.
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Probe
        run: node .github/checks/probe-ipv6.mjs "https://degra.af/.well-known/security.txt" 40
